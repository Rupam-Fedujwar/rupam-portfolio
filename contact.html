<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Rupam Fedujwar</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar">
    <div class="nav-container">
        <div class="nav-logo">
            <h2>Rupam Fedujwar</h2>
        </div>
        <ul class="nav-menu">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="education.html">Education</a></li>
            <li><a href="experience.html">Experience</a></li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="research.html">Research</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
    </div>
</nav>

<!-- HEADER -->
<section class="page-header">
    <div class="container">
        <h1>Contact Me</h1>
        <p>Get in touch for research collaboration or inquiries</p>
    </div>
</section>

<!-- CONTACT -->
<section class="contact-content">
    <div class="container">
        <div class="contact-grid">

            <!-- LEFT INFO -->
            <div class="contact-info">
                <h2>Get in Touch</h2>

                <p>Feel free to contact me anytime.</p>

                <p><b>Email:</b> rupam_f@ce.iitr.ac.in</p>
                <p><b>Phone:</b> +91-7709536888</p>
            </div>

            <!-- FORM -->
            <div class="contact-form">
                <h2>Send a Message</h2>

                <form id="contactForm">

                    <input type="text" id="name" placeholder="Your Name" required>

                    <input type="email" id="email" placeholder="Your Email" required>

                    <input type="text" id="subject" placeholder="Subject" required>

                    <textarea id="message" rows="5" placeholder="Message" required></textarea>

                    <button type="submit">
                        Send Message
                    </button>

                    <div id="formStatus"></div>

                </form>
            </div>

        </div>
    </div>
</section>

<!-- EMAILJS -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

<script>
    // ✅ INIT WITH YOUR KEY
    emailjs.init("oJUbJxCfjfVDTTVwo");

    document.getElementById("contactForm").addEventListener("submit", function(e) {
        e.preventDefault();

        const status = document.getElementById("formStatus");

        const params = {
            from_name: document.getElementById("name").value,
            from_email: document.getElementById("email").value,
            subject: document.getElementById("subject").value,
            message: document.getElementById("message").value
        };

        status.innerHTML = "⏳ Sending...";

        emailjs.send("service_f125nlc", "template_60klr5h", params)
        .then(function() {
            status.innerHTML = "✅ Message sent successfully!";
            document.getElementById("contactForm").reset();
        })
        .catch(function(error) {
            console.error(error);
            status.innerHTML = "❌ Error: " + JSON.stringify(error);
        });
    });
</script>

</body>
</html>
