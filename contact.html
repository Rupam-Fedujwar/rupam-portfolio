<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Rupam Fedujwar</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        body {
            font-family: Arial;
            margin: 0;
        }

        .navbar {
            background: #fff;
            padding: 15px;
            display: flex;
            justify-content: space-between;
        }

        .page-header {
            background: #3b6e91;
            color: white;
            text-align: center;
            padding: 60px 20px;
        }

        .contact-content {
            padding: 40px;
            display: flex;
            justify-content: center;
        }

        .contact-grid {
            display: flex;
            gap: 40px;
            width: 100%;
            max-width: 1000px;
        }

        .contact-info {
            flex: 1;
        }

        .contact-form {
            flex: 1;
            background: #f9f9f9;
            padding: 20px;
            border-radius: 10px;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
        }

        button {
            padding: 10px;
            width: 100%;
            background: #007BFF;
            color: white;
            border: none;
        }

        #formStatus {
            margin-top: 10px;
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    <h2>Rupam Fedujwar</h2>
</div>

<!-- HEADER -->
<div class="page-header">
    <h1>Contact Me</h1>
    <p>Get in touch for research collaboration or inquiries</p>
</div>

<!-- CONTACT -->
<div class="contact-content">
    <div class="contact-grid">

        <!-- LEFT -->
        <div class="contact-info">
            <h3>Get in Touch</h3>
            <p>Email: rupam_f@ce.iitr.ac.in</p>
            <p>Phone: +91-7709536888</p>
        </div>

        <!-- RIGHT FORM -->
        <div class="contact-form">
            <h3>Send a Message</h3>

            <form id="contactForm">

                <input type="text" id="name" placeholder="Your Name" required>

                <input type="email" id="email" placeholder="Your Email" required>

                <input type="text" id="subject" placeholder="Subject" required>

                <textarea id="message" rows="5" placeholder="Message" required></textarea>

                <button type="submit">Send Message</button>

                <div id="formStatus"></div>

            </form>
        </div>

    </div>
</div>

<!-- EMAILJS -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

<script>
    emailjs.init("oJUbJxCfjfVDTTVwo");

    document.getElementById('contactForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const formStatus = document.getElementById('formStatus');

        const params = {
            from_name: document.getElementById('name').value,
            from_email: document.getElementById('email').value,
            subject: document.getElementById('subject').value,
            message: document.getElementById('message').value
        };

        formStatus.innerHTML = "⏳ Sending...";

        emailjs.send("service_f125nlc", "template_60klr5h", params)
        .then(function(response) {
            console.log("SUCCESS", response);
            formStatus.innerHTML = "✅ Message sent successfully!";
            document.getElementById('contactForm').reset();
        })
        .catch(function(error) {
            console.error("ERROR", error);
            formStatus.innerHTML = "❌ Error: " + JSON.stringify(error);
        });
    });
</script>

</body>
</html>
